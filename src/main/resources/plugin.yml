name: AtlasRTP
main: net.atlasmc.rtp.RtpPlugin
version: 1.0.0
api-version: '1.21'
description: Menulu RTP sistemi ve RTP NPC
commands:
  rtp:
    description: Isinlanma menusunu acar
    permission: atlasrtp.use
  rtpnpcolustur:
    description: Bulundugunuz yerde RTP NPC olusturur
    permission: atlasrtp.admin
  rtpnpcsil:
    description: En yakin RTP NPC yi siler
    permission: atlasrtp.admin
permissions:
  atlasrtp.use:
    default: true
  atlasrtp.admin:
    default: op
